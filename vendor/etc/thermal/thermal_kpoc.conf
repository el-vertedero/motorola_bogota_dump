[policy_type]
# If permanent= Yes, this policy is still valid after reboot
permanent= Yes

[LTF-disable-throttling]
# If HW_protection= disabled, it will turn off
# SW shutdown protections and LVTS HW reboot protection
HW_protection= enabled

[user-virtual-sensor]
virtual_sensor= back_temp
ref_sensor= [ap_ntc,battery,quiet_ntc,chg_ntc]
ref_sensor_class= [kernel,kernel,kernel,kernel]
operation= coefficient
coef= [0.790081,0.652028,0.087474,-0.57531]
offset= 1922.24646239329
trip_sensor= ap_ntc
trip_sensor_type=kernel
trip_temp= 10000
hysteresis= 2000

[user-virtual-sensor]
virtual_sensor= front_temp
ref_sensor= [ap_ntc,battery,quiet_ntc,chg_ntc]
ref_sensor_class= [kernel,kernel,kernel,kernel]
operation= coefficient
coef= [0.775469,0.639592,0.160984,-0.60590]
offset= 1163.07605350202
trip_sensor= ap_ntc
trip_sensor_type=kernel
trip_temp= 10000
hysteresis= 2000

[mtk-skin-control]
sensor= ap_ntc
max_target_tj= 85000
min_target_tj= 85000
trip_tpcb= 78000
target_tpcb= 80000

[mtk-cpu-table-mapping]
mode= disabled
sensor= back_temp
cluster= 0
threshold= [39000, 40000, 41000, 42000]
hysteresis= [2000, 1000, 1000, 1000]
freq= [1850000, 1750000, 1650000, 1550000]

[mtk-cpu-table-mapping]
mode= disabled
sensor= back_temp
cluster= 1
threshold= [39000, 40000, 41000, 42000]
hysteresis= [2000, 1000, 1000, 1000]
freq= [1950000, 1750000, 1650000, 1550000]

[charger-cooler]
mode= enabled
sensor= ap_ntc
threshold= [39000, 40000, 41000, 43000, 44000, 48000]
hysteresis= [2000, 1000, 1000, 2000, 1000, 2000]
current= [5000, 4500, 4000, 3400, 2500, 2000]

[thermalhal-threshold]
type= SKIN
sensor= ap_ntc
level= [severe, critical, emergency, shutdown]
threshold= [47000, 85000, 90000, 95000]
