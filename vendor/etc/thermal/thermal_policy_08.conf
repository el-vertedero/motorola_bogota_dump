[policy_type]
# If permanent= Yes, this policy is still valid after reboot
permanent= Yes

[LTF-disable-throttling]
# If HW_protection= disabled, it will turn off
# SW shutdown protections and LVTS HW reboot protection
HW_protection= enabled

[mtk-skin-control]
sensor= vtskin1
max_target_tj= 85000
min_target_tj= 85000
trip_tpcb= 78000
target_tpcb= 80000

[vtskin-param]
sensor= vtskin1
operation= coefficient
ref_sensor= [ap_ntc,battery,quiet_ntc,chg_ntc,tspk_ntc]
ref_coef= [-19000000,23000000,7000000,-23000000,114000000]

[thermalhal-threshold]
type= SKIN
sensor= vtskin1
level= [severe, critical, emergency, shutdown]
threshold= [47900, 55000, 97000, 98000]
hysteresis= [2000, 7100, 1000, 1000]

[user-virtual-sensor]
virtual_sensor= back_temp
ref_sensor= [ap_ntc,battery,quiet_ntc,chg_ntc,tspk_ntc]
ref_sensor_class= [kernel,kernel,kernel,kernel,kernel]
operation= coefficient
coef= [-0.861317,0.186930,0.635194,0.200190,0.820898]
offset= 1459.91086098481
trip_sensor= ap_ntc
trip_sensor_type=kernel
trip_temp= 10000
hysteresis= 2000

[user-virtual-sensor]
virtual_sensor= front_temp
ref_sensor= [ap_ntc,battery,quiet_ntc,chg_ntc,tspk_ntc]
ref_sensor_class= [kernel,kernel,kernel,kernel,kernel]
operation= coefficient
coef= [0.087530,0.096364,0.256109,-0.484700,1.007880]
offset= 732.341529138503
trip_sensor= ap_ntc
trip_sensor_type=kernel
trip_temp= 10000
hysteresis= 2000

[mtk-cpu-table-mapping]
mode= enabled
sensor= back_temp
cluster= 0
threshold= [43000, 44000, 45000, 46000]
hysteresis= [2000, 1000, 1000, 1000]
freq= [1850000, 1750000, 1650000, 1550000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= back_temp
cluster= 1
threshold= [41000, 43000, 44000, 45000, 46000]
hysteresis= [2000, 2000, 1000, 1000, 1000]
freq= [2200000, 1950000, 1750000, 1650000, 1550000]

[mtk-gpu-table-mapping]
mode= enabled
sensor= front_temp
threshold= [45000, 47000, 49000]
hysteresis= [2000, 2000, 2000]
freq= [735000, 690000, 660000]


[charger-cooler]
mode= enabled
sensor= back_temp
threshold= [32000, 34000, 36000, 38000, 39000, 42000, 45000]
hysteresis= [2000, 2000, 2000, 2000, 1000, 3000, 3000]
current= [4700, 4000, 3000, 2000, 1500, 1000, 500]
